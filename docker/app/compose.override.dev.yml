#
# Override for dev environment
#

services:
  app:
    build:
      target: base
      context: ./
      dockerfile: ./docker/app/Dockerfile # Relative to `context`
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      # Always use the compose service hostname. ${DATABASE_URL} from the host/.env
      # can point at 127.0.0.1, which inside this container is not Postgres.
      - DATABASE_URL=postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:?}
      # File Watching Optimierung für Docker auf Mac
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@soliloan.localhost
    ports:
      # Host loopback only: next-devtools-mcp and next-dev-loop probe /_next/mcp
      # at http://localhost:3000. Browser and auth stay on Traefik
      # (https://soliloan.localhost). Do not publish 0.0.0.0:3000 — MCP is a
      # privileged dev endpoint.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    command: /bin/sh -c "pnpm install && pnpm prisma db push --accept-data-loss && pnpm prisma db seed && pnpm dev"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend_network